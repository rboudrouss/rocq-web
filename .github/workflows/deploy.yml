name: Deploy

# Builds and deploys the site (docs/deploying.md) on GitHub's runners, for
# each push to main, and every Monday when coq-lsp's v9.2 branch has a new
# commit. A push changing only the app, the docs or the tests since the last
# full build redeploys the site only, with that build's artifacts.
#
#   plan      what to redo: all, site or nothing
#   switch    the opam switch, from the cache unless .github/opam/ changed
#   sysroot   ocaml-emcc's libraries for wasm64 (coq-lsp, rocq-runtime...)
#   build     full and compat, in parallel
#   deploy    R2 and Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'
  # a full build and deployment
  workflow_dispatch:

permissions:
  # the updated recipe, pushed with GITHUB_TOKEN, which starts no other run
  contents: write
  # the artifacts of earlier runs
  actions: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      redo: ${{ steps.plan.outputs.redo }}
      coq-lsp: ${{ steps.plan.outputs.commit }}
      built-run: ${{ steps.plan.outputs.built-run }}
      built-commit: ${{ steps.plan.outputs.built-commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The last full build is the run of the newest artifact "built", which
      # holds its commit
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
        run: |
          site_only='^(app/|docs/|tests/|README\.md$|scripts/(dist|cloudflare|serve)\.mjs$)'
          built_run=$(gh api "repos/$REPO/actions/artifacts?name=built&per_page=10" \
            --jq '[.artifacts[] | select(.expired | not)][0].workflow_run.id // empty')
          built=
          if [ -n "$built_run" ] &&
            [ "$(gh api "repos/$REPO/actions/runs/$built_run/artifacts" \
              --jq '[.artifacts[] | select(.expired | not) | .name | select(. == "web-full" or . == "web-compat")] | length')" = 2 ]; then
            gh run download "$built_run" -R "$REPO" -n built -D "$RUNNER_TEMP/built"
            built=$(cat "$RUNNER_TEMP/built/commit")
          fi
          if [ "$EVENT" = schedule ]; then
            coq_lsp=$(scripts/update-coq-lsp.sh)
            echo "$coq_lsp" >> "$GITHUB_OUTPUT"
            case $coq_lsp in *changed=true*) redo=all ;; *) redo=nothing ;; esac
          elif [ "$EVENT" = push ] && [ -n "$built" ] && git cat-file -e "$built^{commit}" 2>/dev/null &&
            ! git diff --name-only "$built" HEAD | grep -qvE "$site_only"; then
            redo=site
          else
            redo=all
          fi
          echo "built-run=$built_run" >> "$GITHUB_OUTPUT"
          echo "built-commit=$built" >> "$GITHUB_OUTPUT"
          echo "redo=$redo" | tee -a "$GITHUB_OUTPUT"

  # Restored from the cache when there, otherwise installed (hours). An
  # install stopped before the end saves what it did, and the next run goes
  # on from there.
  switch:
    needs: plan
    if: needs.plan.outputs.redo == 'all'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - id: cached
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.opam
            !~/.opam/rocq-web/emcc-sysroot
          key: switch-${{ hashFiles('.github/opam/*') }}
          lookup-only: true
      - if: steps.cached.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup
      - if: steps.cached.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.opam
            !~/.opam/rocq-web/emcc-sysroot
          key: switch-partial-${{ hashFiles('.github/opam/*') }}-
          restore-keys: switch-partial-${{ hashFiles('.github/opam/*') }}-
      - id: install
        if: steps.cached.outputs.cache-hit != 'true'
        timeout-minutes: 310
        run: .github/opam/install.sh
      - if: always() && steps.cached.outputs.cache-hit != 'true' && steps.install.outcome != 'success' && steps.install.outcome != 'skipped'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.opam
            !~/.opam/rocq-web/emcc-sysroot
          key: switch-partial-${{ hashFiles('.github/opam/*') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - if: steps.install.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.opam
            !~/.opam/rocq-web/emcc-sysroot
          key: switch-${{ hashFiles('.github/opam/*') }}

  # ocaml-emcc builds these libraries the first time a program needs them,
  # again when it or the recipes change
  sysroot:
    needs: [plan, switch]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      ocaml-emcc: ${{ steps.commits.outputs.ocaml-emcc }}
      c-of-ocaml: ${{ steps.commits.outputs.c-of-ocaml }}
    env:
      COQ_LSP: ${{ needs.plan.outputs.coq-lsp }}
    steps:
      - uses: actions/checkout@v7
      - id: commits
        run: |
          echo "ocaml-emcc=$(git ls-remote https://github.com/rboudrouss/ocaml-emcc.git HEAD | cut -f1)" >> "$GITHUB_OUTPUT"
          echo "c-of-ocaml=$(git ls-remote https://github.com/rboudrouss/C_of_ocaml.git HEAD | cut -f1)" >> "$GITHUB_OUTPUT"
      - if: env.COQ_LSP != ''
        run: scripts/update-coq-lsp.sh "$COQ_LSP"
      - id: cached
        uses: actions/cache/restore@v6
        with:
          path: ~/.opam/rocq-web/emcc-sysroot
          key: sysroot-${{ steps.commits.outputs.ocaml-emcc }}-${{ steps.commits.outputs.c-of-ocaml }}-${{ hashFiles('emcc-recipes/**') }}
          lookup-only: true
      - if: steps.cached.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup
      - if: steps.cached.outputs.cache-hit != 'true'
        uses: ./.github/actions/toolchain
        with:
          ocaml-emcc: ${{ steps.commits.outputs.ocaml-emcc }}
          c-of-ocaml: ${{ steps.commits.outputs.c-of-ocaml }}
      # an older sysroot, which ocaml-emcc updates
      - if: steps.cached.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v6
        with:
          path: ~/.opam/rocq-web/emcc-sysroot
          key: sysroot-${{ steps.commits.outputs.ocaml-emcc }}-${{ steps.commits.outputs.c-of-ocaml }}-${{ hashFiles('emcc-recipes/**') }}
          restore-keys: sysroot-
      - if: steps.cached.outputs.cache-hit != 'true'
        run: make out/full/lsp_worker.js
      - if: steps.cached.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.opam/rocq-web/emcc-sysroot
          key: sysroot-${{ steps.commits.outputs.ocaml-emcc }}-${{ steps.commits.outputs.c-of-ocaml }}-${{ hashFiles('emcc-recipes/**') }}

  build:
    needs: [plan, sysroot]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        build: [full, compat]
    env:
      COQ_LSP: ${{ needs.plan.outputs.coq-lsp }}
    steps:
      - uses: actions/checkout@v7
      - if: env.COQ_LSP != ''
        run: scripts/update-coq-lsp.sh "$COQ_LSP"
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/toolchain
        with:
          ocaml-emcc: ${{ needs.sysroot.outputs.ocaml-emcc }}
          c-of-ocaml: ${{ needs.sysroot.outputs.c-of-ocaml }}
      - uses: actions/cache/restore@v6
        with:
          path: ~/.opam/rocq-web/emcc-sysroot
          key: sysroot-${{ needs.sysroot.outputs.ocaml-emcc }}-${{ needs.sysroot.outputs.c-of-ocaml }}-${{ hashFiles('emcc-recipes/**') }}
          fail-on-cache-miss: true
      - run: make ${{ matrix.build }}
      - uses: actions/upload-artifact@v7
        with:
          name: web-${{ matrix.build }}
          path: out/${{ matrix.build }}/web
          retention-days: 90
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ matrix.build }}
          path: ~/.opam/rocq-web/emcc-sysroot/*/build/*/*.log

  deploy:
    needs: [plan, build]
    if: ${{ !cancelled() && (needs.plan.outputs.redo == 'site' || (needs.plan.outputs.redo == 'all' && needs.build.result == 'success')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER: npx --yes wrangler@4.165.0
      REDO: ${{ needs.plan.outputs.redo }}
      COQ_LSP: ${{ needs.plan.outputs.coq-lsp }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - if: env.COQ_LSP != ''
        run: scripts/update-coq-lsp.sh "$COQ_LSP"
      # This run's builds, or those of the last full build for the site only
      - uses: actions/download-artifact@v8
        with:
          name: web-full
          path: out/full/web
          run-id: ${{ needs.plan.outputs.redo == 'site' && needs.plan.outputs.built-run || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          name: web-compat
          path: out/compat/web
          run-id: ${{ needs.plan.outputs.redo == 'site' && needs.plan.outputs.built-run || github.run_id }}
          github-token: ${{ github.token }}
      # The commit of the programs, for the About panel
      - env:
          BUILT: ${{ needs.plan.outputs.built-commit }}
        run: |
          if [ "$REDO" = site ]; then echo "$BUILT"; else git rev-parse HEAD; fi > out/.built-commit
      - if: env.REDO == 'all'
        run: make deploy
      # The files on R2 come from the programs, unchanged
      - if: env.REDO == 'site'
        run: make dist cloudflare pages
      # The commit this build stands for, the recipe's when it moved. If
      # newer commits came meanwhile, it is not on main once rebased, and the
      # next push rebuilds everything.
      - if: env.REDO == 'all'
        run: |
          mkdir -p "$RUNNER_TEMP/built"
          cp out/.built-commit "$RUNNER_TEMP/built/commit"
      - if: env.COQ_LSP != ''
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -qm "build(coq-lsp): ${COQ_LSP:0:8} of the v9.2 branch" emcc-recipes/coq-lsp/recipe.sh
          git rev-parse HEAD > "$RUNNER_TEMP/built/commit"
          git pull -q --rebase
          git push
      - if: env.REDO == 'all'
        uses: actions/upload-artifact@v7
        with:
          name: built
          path: ${{ runner.temp }}/built/commit
          retention-days: 90
