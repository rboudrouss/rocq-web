name: Setup
description: Disk space, opam, node and pnpm, emsdk
runs:
  using: composite
  steps:
    # The runner's SDKs that the build does not use, for about 30 GB
    - name: Free disk space
      shell: bash
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
        df -h /
    - name: System packages
      shell: bash
      run: |
        sudo apt-get update -q
        sudo apt-get install -yq opam libgmp-dev ninja-build
    - uses: actions/setup-node@v7
      with:
        node-version: 24
    - uses: pnpm/action-setup@v6
      with:
        version: 12
    # Where the Makefile looks for it
    - uses: actions/cache@v6
      with:
        path: ~/tools/emsdk
        key: emsdk-6.0.11
    - name: emsdk
      shell: bash
      run: |
        [ -d ~/tools/emsdk ] || git clone -q --depth 1 https://github.com/emscripten-core/emsdk.git ~/tools/emsdk
        ~/tools/emsdk/emsdk install 6.0.11
        ~/tools/emsdk/emsdk activate 6.0.11
